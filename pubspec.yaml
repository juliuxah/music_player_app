  permission_handler: ^11.3.0
  flutter_inappwebview: ^6.1.5
  screenshot: ^3.0.0
  share_plus: ^13.3.0
  flutter_launcher_icons: ^0.13.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.2.5
