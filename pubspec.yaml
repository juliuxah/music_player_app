name: music_player_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  audio_session: ^0.1.25
  path_provider: ^2.1.0
  cupertino_icons: ^1.0.8
  file_picker: ^12.1.2
  flutter_taglib: ^1.5.2
  shared_preferences: ^2.2.2
